models:
  - name: dimension_date
    description: "Dimension temporelle des issues GitHub"
    columns:
      - name: id_date
        description: "Identifiant unique de la date (date normalisée)"
        tests:
          - unique
          - not_null

      - name: jour
        description: "Jour du mois (1-31)"
        tests:
          - not_null

      - name: mois
        description: "Mois de l'année (1-12)"
        tests:
          - not_null

      - name: annee
        description: "Année (ex: 2025)"
        tests:
          - not_null

  - name: dimension_statut
    description: "Dimension des statuts des issues GitHub"
    columns:
      - name: id_statut
        description: "Identifiant du statut de l'issue (open, closed)"
        tests:
          - unique
          - not_null

      - name: statut
        description: "Nom du statut de l'issue (ex: open, closed)"
        tests:
          - not_null

      - name: description
        description: "Description du statut (peut être enrichie plus tard)"

  - name: dimension_responsable
    description: "Table des responsables liés aux issues"
    columns:
      - name: id_responsable
        description: "Identifiant unique du responsable"
        tests:
          - unique
          - not_null

      - name: nom
        description: "Nom du responsable (normalisé en minuscule)"
        tests:
          - not_null

      - name: role
        description: "Rôle du responsable"
        tests:
          - not_null
          - accepted_values:
              values: ["Contributeur"]

      - name: email
        description: "Email (s'il est disponible, sinon NULL)"

  - name: dimension_priorite
    description: "Table de dimension des priorités des issues GitHub"
    columns:
      - name: id_priorite
        description: "Identifiant unique de la priorité (basé sur le nombre de commentaires)"
        tests:
          - unique
          - not_null

      - name: priorite
        description: "Niveau de priorité de l'issue (Haute, Moyenne, Basse)"
        tests:
          - not_null
          - accepted_values:
              values: ["Haute", "Moyenne", "Basse"]

  - name: dimension_type
    description: "Dimension des types d'issues (Bug, Feature, Documentation, Autre)"
    columns:
      - name: id_type
        description: "Identifiant unique du type d'issue"
        tests:
          - unique
          - not_null

      - name: type
        description: "Type d'issue (Bug, Feature, Documentation, Autre)"
        tests:
          - not_null
          - accepted_values:
              values: ["Bug", "Feature", "Documentation", "Autre"]

  - name: dimension_module
    description: "Dimension des modules concernés par une issue"
    columns:
      - name: id_module
        description: "Identifiant unique du module"
        tests:
          - unique
          - not_null

      - name: module
        description: "Nom du module (ex: UI, API, Auth, Autre)"
        tests:
          - not_null


  - name: fact_issues
    description: "Table des issues provenant de GitHub"
    columns:
      - name: issue_id
        description: "Identifiant unique de l'issue"

      - name: issue_number
        description: "Numéro de l'issue dans le dépôt"

      - name: issue_state
        description: "État de l'issue (open/closed)"

      - name: id_statut
        description: "Clé étrangère vers la table `dimension_statut`"

      - name: id_type
        description: "Type de l'issue (Bug, Feature, Documentation, Autre)"

      - name: issue_title
        description: "Titre de l'issue"

      - name: id_date_creation
        description: "Date de création de l'issue"

      - name: id_date_cloture
        description: "Date de clôture de l'issue"

      - name: id_date_update
        description: "Date de mise à jour de l'issue"

      - name: contributor_id
        description: "Identifiant du contributeur ayant créé l'issue"

      - name: id_priorite
        description: "ID de la priorité (Basse, Moyenne, Haute)"

    indicators:
      - name: total_issues
        description: "Nombre total d'issues"
        calculation: "COUNT(issue_id)"
      - name: avg_resolution_time_days
        description: "Délai moyen entre ouverture et fermeture"
        calculation: "AVG(DATEDIFF(id_date_cloture, id_date_creation))"
      - name: resolution_percentage
        description: "Pourcentage d'issues résolues"
        calculation: "COUNT(CASE WHEN issue_state = 'closed' THEN 1 END) * 100.0 / COUNT(issue_id)"
      - name: critical_issues
        description: "Nombre d'issues critiques"
        calculation: "SUM(CASE WHEN id_priorite = 3 THEN 1 ELSE 0 END)"
      - name: high_issues
        description: "Nombre d'issues élevées"
        calculation: "SUM(CASE WHEN id_priorite = 2 THEN 1 ELSE 0 END)"
      - name: low_issues
        description: "Nombre d'issues faibles"
        calculation: "SUM(CASE WHEN id_priorite = 1 THEN 1 ELSE 0 END)"
      - name: distinct_types
        description: "Nombre de types d'issues distincts"
        calculation: "COUNT(DISTINCT id_type)"
      - name: distinct_responsibles
        description: "Nombre de responsables distincts"
        calculation: "COUNT(DISTINCT contributor_id)"