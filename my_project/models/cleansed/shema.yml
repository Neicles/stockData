models:
  - name: forks
    description: "Données nettoyées des forks GitHub"
    columns:
      - name: id
        description: "Identifiant unique du fork"
        tests:
          - unique
          - not_null

      - name: owner_login
        description: "Nom du propriétaire du fork"
        tests:
          - not_null

      - name: created_at
        description: "Date de création du fork"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: "'2008-01-01'"
              max_value: "'2025-12-31'"
              strictly: false

      - name: updated_at
        description: "Date de dernière mise à jour du fork"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: "'2008-01-01'"
              max_value: "'2025-12-31'"
              strictly: false

      - name: forks_count
        description: "Nombre de forks"
        tests:
          - not_null

      - name: archived
        description: "Indique si le dépôt est archivé"
        tests:
          - not_null
          - accepted_values:
              values: [true, false]

      - name: disabled
        description: "Indique si le dépôt est désactivé"
        tests:
          - not_null
          - accepted_values:
              values: [true, false]

  - name: stargazer
    description: "Données nettoyées des utilisateurs ayant étoilé un repo GitHub"
    columns:
      - name: stargazer_id
        description: "Identifiant unique de l'utilisateur"
        tests:
          - unique
          - not_null

      - name: user_login
        description: "Nom du propriétaire du compte GitHub"
        tests:
          - not_null

      - name: avatar_url
        description: "URL de l'avatar de l'utilisateur"
        tests:
          - not_null

      - name: html_url
        description: "URL du profil GitHub"
        tests:
          - not_null

      - name: user_type
        description: "Type de compte (User, Organization)"
        tests:
          - not_null
          - accepted_values:
              values: ["User", "Organization"]

      - name: site_admin
        description: "Indique si l'utilisateur est un admin GitHub"
        tests:
          - not_null
          - accepted_values:
              values: [true, false]

  - name: contributors
    description: "Données nettoyées des contributeurs GitHub"
    columns:
      - name: contributor_id
        description: "Identifiant unique du contributeur"
        tests:
          - unique
          - not_null

      - name: contributor_login
        description: "Nom du contributeur (normalisé en minuscule)"
        tests:
          - not_null

      - name: nombre_contributions
        description: "Nombre total de contributions du contributeur"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 1000000
              strictly: false

  - name: subscribers
    description: "Données nettoyées des abonnés GitHub"
    columns:
      - name: subscriber_id
        description: "Identifiant unique de l'abonné"
        tests:
          - unique
          - not_null

      - name: subscriber_login
        description: "Nom du compte de l'abonné (normalisé en minuscule)"
        tests:
          - not_null

      - name: avatar_url
        description: "URL de l'avatar de l'abonné"
        tests:
          - not_null

      - name: html_url
        description: "URL du profil GitHub"
        tests:
          - not_null

      - name: user_type
        description: "Type de compte (User, Organization)"
        tests:
          - not_null
          - accepted_values:
              values: ["User", "Organization"]

      - name: site_admin
        description: "Indique si l'abonné est un admin GitHub"
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
